[package]
name = "concat-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The edit in a browser tab: concat-project compiled to WebAssembly behind a small JSON-in, JSON-out surface."

[lib]
# cdylib is what wasm-bindgen / wasm-pack turn into the .wasm; rlib keeps
# `cargo test -p concat-web` working on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Only the crates with no native dependencies. concat-media (FFmpeg),
# concat-render (wgpu, via the web host instead), concat-speech and
# concat-vision are deliberately not here: see web/PORTING.md.
concat-project.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[lints]
workspace = true
